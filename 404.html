
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Health - 404 Route Encrypted</title>
    <link rel="stylesheet" href="404.css">
</head>
<body class="error-body-canvas">

    <!-- Ambient Glow System Background -->
    <div class="error-ambient-matrix">
        <div class="glow-orb orbital-red"></div>
        <div class="glow-orb orbital-teal"></div>
        <div class="grid-mesh-overlay"></div>
    </div>

    <!-- Responsive Error Card Capsule -->
    <main class="error-console-wrapper">
        <div class="error-glass-shield">
            
            <div class="error-meta-pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="svg-pill-icon"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                Secure Routing Ledger Boundary
            </div>

            <h1 class="error-numerical-headline">404</h1>
            <h2 class="error-status-title">Diagnostic Sub-Grid Offline</h2>
            <p class="error-supporting-copy">
                The clinical path ledger token you are trying to access points to an unlinked laboratory network node or secure data block that is currently undergoing calibration checks.
            </p>

            <!-- Fully Fluid Responsive Action Buttons Array -->
            <div class="error-action-buttons-group">
                <button class="btn-error-control action-outline-grey" onclick="executeSecureHistoryBack()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="svg-btn-icon"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Go Back to Previous</span>
                </button>
                
                <a href="index.html" class="btn-error-control action-solid-emerald">
                    <span>Return to Home Deck</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="svg-btn-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>

            <div class="error-console-footer">
                <span class="verification-stamp-label">System State: Encrypted Vigilance</span>
            </div>

        </div>
    </main>

<style>
    :root {
    --bg-clinical-dark: #050b0c;
    --card-glass: rgba(14, 30, 33, 0.75);
    --neon-emerald: #00e5c1;
    --clinical-teal: #0a8491;
    --coral-alert: #ff5c75;
    --text-pure: #ffffff;
    --text-dimmed: #94b2b5;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body.error-body-canvas {
    background-color: var(--bg-clinical-dark);
    height: 100vh;
    width: 100vw;
    overflow-x: hidden;
    overflow-y: auto; /* Allows smooth page scrolling on small mobile screens */
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
}

/* --- Ambient Backdrop Glows System --- */
.error-ambient-matrix {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: hidden;
}

.glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    pointer-events: none;
}

.orbital-red { width: 400px; height: 400px; background-color: var(--coral-alert); top: -100px; left: -100px; }
.orbital-teal { width: 500px; height: 500px; background-color: var(--clinical-teal); bottom: -150px; right: -150px; }
.grid-mesh-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(5, 11, 12, 0.94) 0%, rgba(9, 19, 21, 0.88) 100%); z-index: 2; }

/* --- Central Console Card --- */
.error-console-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 620px;
    margin: auto;
}

.error-glass-shield {
    background: var(--card-glass);
    border: 1px solid rgba(255, 92, 117, 0.2);
    border-radius: 24px;
    padding: 60px 45px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.error-meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 92, 117, 0.06);
    border: 1px solid rgba(255, 92, 117, 0.2);
    color: var(--coral-alert);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 30px;
}

.svg-pill-icon { width: 14px; height: 14px; }

.error-numerical-headline {
    font-size: 110px;
    font-weight: 900;
    color: var(--coral-alert);
    line-height: 1;
    margin-bottom: 16px;
    letter-spacing: -2px;
}

.error-status-title {
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.2px;
}

.error-supporting-copy {
    color: var(--text-dimmed);
    font-size: 15.5px;
    line-height: 1.6;
    margin-bottom: 45px;
    max-width: 500px;
}

/* --- Control Buttons Action Layout --- */
.error-action-buttons-group {
    display: flex;
    width: 100%;
    gap: 16px;
    justify-content: center;
    margin-bottom: 35px;
}

.btn-error-control {
    flex: 1;
    max-width: 240px;
    padding: 15px 0;
    font-size: 14.5px;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.svg-btn-icon { width: 15px; height: 15px; flex-shrink: 0; }

.action-outline-grey { border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff; background: transparent; }
.action-outline-grey:hover { background-color: rgba(255, 255, 255, 0.05); border-color: #ffffff; transform: translateY(-2px); }
.action-outline-grey:hover .svg-btn-icon { transform: translateX(-3px); }

.action-solid-emerald { background: linear-gradient(135deg, var(--clinical-teal), #00bfa3); color: var(--text-pure); border: none; box-shadow: 0 4px 15px rgba(0, 229, 193, 0.25); }
.action-solid-emerald:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 229, 193, 0.45); }

.error-console-footer { border-top: 1px solid rgba(255, 255, 255, 0.03); width: 100%; padding-top: 20px; }
.verification-stamp-label { color: var(--text-dimmed); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; }

/* --- 📱 CRITICAL MOBILE RESPONSIVE MEDIA QUERIES BREAKPOINTS --- */
@media (max-width: 650px) {
    body.error-body-canvas {
        padding: 15px;
        align-items: flex-start; /* Better alignment for scroll behaviors on small viewports */
    }
    .error-glass-shield {
        padding: 45px 20px;
        border-radius: 20px;
    }
    .error-numerical-headline {
        font-size: 85px; /* Scales text height to maximize room */
    }
    .error-status-title {
        font-size: 20px;
    }
    .error-supporting-copy {
        font-size: 14.5px;
        margin-bottom: 35px;
    }
    /* Fixed: Stacks actions vertically on mobile screens seamlessly */
    .error-action-buttons-group {
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .btn-error-control {
        width: 100%;
        max-width: 100%; /* Spans to container boundaries automatically */
        padding: 14px 0;
    }
}

</style>

<script>
    /**
     * Navigate to the exact previous page and section
     */
    function executeSecureHistoryBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
